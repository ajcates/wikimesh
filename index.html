<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Mockup</title>
    <!-- Load Roboto font from Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <!-- Header: Logo, search, and toolbar -->
    <header>
        <div class="header-container">
            <div class="logo">📚 Wiki</div>
            <form class="search-bar">
                <input type="text" placeholder="Search...">
                <button>🔍</button>
            </form>
            <nav class="toolbar">
                <a href="#home">🏠🏡🛖</a>
                <a href="#new">🆕✏️📜</a>
                <a href="#cats">🐱🐯🦁</a>
                <a href="#settings">⚙️🎛️🛠️</a>
            </nav>
        </div>       
    </header>

    <!-- Sidebar: Collapsible categories with animation -->
    <aside>
        <h2 class="categories-toggle collapsed">📂 Categories</h2>
        <div class="categories-list" id="categories-list">
            <a href="#">🔬 Science</a>
            <a href="#">📜 History</a>
            <a href="#">💻 Technology</a>
            <a href="#">🎨 Arts</a>
        </div>
    </aside>

    <!-- Main content: Dynamic content based on route -->
    <main id="main-content">
        <div class="edit-container" id="edit-container" style="display: none;">
            <h1 id="form-title">Create Article</h1>
            <div class="edit-form" id="article-form">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="Enter article title" required>
                <label for="slug">Slug</label>
                <input type="text" id="slug" placeholder="e.g., my-article-title" required>
                <p style="font-size: 0.9em; color: var(--text-color);">URL-friendly identifier (lowercase letters, numbers, hyphens only)</p>
                <label for="instructions">Article Instructions</label>
                <textarea id="instructions" placeholder="Instructions for the article" required></textarea>
                <div class="form-actions">
                    <button type="button" id="preview-btn">👁️ Preview</button>
                    <button type="button" id="ai-btn">🤖 AI Generate</button>
                </div>
                <label for="content">Content</label>
                <textarea id="content" placeholder="Article content" required></textarea>
                <div class="form-actions">
                    <button type="button" id="save-btn">💾 Save</button>
                    <button type="button" class="cancel" id="cancel-btn">❌ Cancel</button>
                </div>
                <p id="error-msg" style="color: red; display: none;"></p>
            </div>
        </div>
        <div class="view-container" id="view-container" style="display: none;">
            <h1 id="article-title"></h1>
            <div class="content" id="article-content"></div>
            <div class="actions">
                <button id="edit-btn">✍️ Edit</button>
                <button id="back-to-home-btn">🏠 Back to Home</button>
            </div>
        </div>
        <div class="home-container" id="home-container">
            <h1>Articles</h1>
            <ul id="article-list"></ul>
        </div>
    </main>

    <!-- Footer: Copyright on left, controls on right -->
    <footer>
        <p>© 2025 Wiki Mockup</p>
        <div class="footer-controls">
            <div class="theme-toggle">
                <input type="checkbox" id="theme-switch">
                <label for="theme-switch"></label>
            </div>
            <div class="font-zoom">
                <button id="zoom-out-btn">🔍-</button>
                <button id="zoom-in-btn">🔍+</button>
            </div>
        </div>
    </footer>

    <!-- Main script: Initialize app and handle routing -->
    <script type="module">
        import { initializeDB } from './dbService.js';
        import { handleRoute } from './router.js';
        import { setupUI } from './ui.js';

        // Wait for DOM to load before initializing
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Initialize IndexedDB and wait for it to be ready
                await initializeDB();
                // Set up UI event listeners
                setupUI();
                // Handle initial route based on URL hash
                handleRoute();
                // Listen for hash changes to update route
                window.addEventListener('hashchange', handleRoute);
            } catch (error) {
                console.error('Failed to initialize application:', error);
                // Display user-friendly error message
                document.body.innerHTML = '<h1>Error</h1><p>Failed to initialize the application. Please try again later.</p>';
            }
        });
    </script>
</body>
</html>
